<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Guard against Web3 extension collisions (MetaMask, Coinbase Wallet, etc.) */
      (function() {
        try {
          const originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || obj === globalThis) && prop === 'ethereum') {
              try {
                return originalDefineProperty.call(Object, obj, prop, {
                  ...descriptor,
                  configurable: true
                });
              } catch (e) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    window.ethereum = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            try {
              return originalDefineProperty.apply(Object, arguments);
            } catch (err) {
              if (prop === 'ethereum') {
                return obj;
              }
              throw err;
            }
          };
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (
            event.message &&
            (event.message.includes('Cannot redefine property: ethereum') ||
             event.message.includes('redefine property: ethereum'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            typeof event.reason.message === 'string' &&
            (event.reason.message.includes('Cannot redefine property: ethereum') ||
             event.reason.message.includes('redefine property: ethereum'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>Investment Forecasting & Opportunity Cost Calculator</title>
